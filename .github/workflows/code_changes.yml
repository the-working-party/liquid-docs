name: Testing on Code Changes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/testing.yml

  node-compat:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    uses: ./.github/workflows/testing.yml
    with:
      node-version: ${{ matrix.node-version }}
